# TastyIgniter nginx site. Placeholders are replaced by install/provision.sh.
server {
    listen __PORT__ default_server;
    server_name _;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;
    server_tokens off;

    access_log /var/log/nginx/tastyigniter-access.log;
    error_log  /var/log/nginx/tastyigniter-error.log warn;

    # ------------------------------------------------------------------
    # React/Vite status dashboard (built with base "/status/")
    # ------------------------------------------------------------------
    location = /status {
        return 301 /status/;
    }

    location ^~ /status/assets/ {
        root __DASH_DIR__/www;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /status/ {
        root __DASH_DIR__/www;
        index index.html;
        try_files $uri $uri/ /status/index.html;
        add_header Cache-Control "no-store";
    }

    # Small PHP endpoint used by the React dashboard.
    location = /status/api/status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __DASH_DIR__/api/status.php;
        fastcgi_param SCRIPT_NAME /status/api/status;
        fastcgi_param DOCUMENT_ROOT __DASH_DIR__/api;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # TastyIgniter / Laravel
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Never execute PHP outside index.php.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # TastyIgniter uploads are static; no PHP execution below /storage.
    location ^~ /storage/ {
        autoindex off;
        try_files $uri =404;
    }

    location ~ ^/(?:themes|extensions)/.*\.(php|php\d*|phtml|phar|cgi|pl|py|asp|aspx|sh)$ {
        deny all;
    }

    # ------------------------------------------------------------------
    # Dynamically generated assets
    #
    # TastyIgniter compiles storefront and admin CSS/JS into bundles that are
    # served by PHP under /_assets/<hash>.css|js (admin: /admin/_assets/…).
    # Livewire ships its runtime at /livewire/livewire.min.js the same way.
    # None of these exist as files, so the static-asset rule below would
    # answer 404 and the whole UI would render unstyled.
    # ------------------------------------------------------------------
    location ^~ /_assets/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /admin/_assets/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
